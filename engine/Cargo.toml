[package]
name = "sql-lineage-rs"
version = "0.2.0"
edition = "2021"
authors = ["James Guisgand"]
description = "AST-based SQL table/column lineage and impact analysis"
license = "MIT"

[dependencies]
sqlparser = { version = "=0.46.0", features = ["visitor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
